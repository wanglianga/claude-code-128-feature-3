server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: denture-order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/dentallab}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  token-ttl-hours: 12
