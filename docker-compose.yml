services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dentallab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - dentallab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dentallab"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/dentallab
      DB_USER: postgres
      DB_PASS: postgres
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  dentallab_pgdata:
